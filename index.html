<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Architecture: The Philosophers' Dinner</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07080d;
            --panel-bg: #0f111a;
            --cyan-glow: #00f0ff;
            --purple-glow: #bd00ff;
            --error-red: #ff0055;
            --warning-amber: #ffaa00;
            --success-green: #00ff66;
            --bus-color: #22263f;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            color: var(--cyan-glow);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            margin-bottom: 5px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            margin-top: 10px;
        }

        .panel-control {
            background: var(--panel-bg);
            border: 1px solid #1a1d30;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .escenario-visual {
            background: var(--panel-bg);
            border: 1px solid #1a1d30;
            border-radius: 12px;
            position: relative;
            height: 520px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
        }

        /* SVG para los buses de datos físicos */
        .bus-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bus-line {
            fill: none;
            stroke: var(--bus-color);
            stroke-width: 4;
            transition: stroke 0.4s;
        }

        /* Esferas de datos animadas */
        .data-pulse {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 10 100;
            display: none;
        }

        @keyframes flowData {
            to { stroke-dashoffset: -200; }
        }

        /* Representación de los Núcleos */
        .hardware-core {
            position: absolute;
            width: 130px;
            height: 130px;
            background: #131625;
            border: 2px solid #22263f;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
            z-index: 2;
            top: 195px;
        }

        #c1 { left: 15%; border-color: var(--cyan-glow); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }
        #c2 { right: 15%; border-color: var(--cyan-glow); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }

        .estado-texto {
            font-size: 0.65rem;
            margin-top: 8px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #000;
            color: #8892b0;
        }

        /* Representación de la RAM */
        .ram-channel {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 50px;
            background: #11091c;
            border: 2px solid #29183b;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.4s;
            z-index: 2;
        }

        #ramA { top: 40px; }
        #ramB { bottom: 40px; }

        /* Estados de animación controlados por JavaScript */
        .pensando { animation: pulsoPensar 2.5s infinite ease-in-out; }
        .hambre { border-color: var(--warning-amber) !important; box-shadow: 0 0 20px rgba(255, 170, 0, 0.4) !important; animation: vibrar 0.3s infinite; }
        .comiendo { border-color: var(--success-green) !important; box-shadow: 0 0 25px rgba(0, 255, 102, 0.5) !important; }
        .bloqueado { border-color: var(--error-red) !important; box-shadow: 0 0 25px rgba(255, 0, 85, 0.6) !important; animation: vibrar 0.1s infinite; }

        .ram-ocupada { background: #300515 !important; border-color: var(--error-red) !important; box-shadow: 0 0 20px rgba(255, 0, 85, 0.3); }

        /* Botones Interactivos */
        button {
            background: transparent;
            color: #8892b0;
            border: 1px solid #22263f;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        button:hover { background: #131625; color: #fff; }
        .btn-danger { color: var(--error-red); border-color: var(--error-red); }
        .btn-danger:hover { background: rgba(255,0,85,0.1); }
        .btn-success { color: var(--success-green); border-color: var(--success-green); }
        .btn-success:hover { background: rgba(0,255,102,0.1); }

        .terminal {
            background: #030407;
            border-left: 3px solid #22263f;
            padding: 12px;
            font-size: 0.75rem;
            color: #8892b0;
            height: 160px;
            overflow-y: auto;
            border-radius: 4px;
            line-height: 1.4;
        }

        @keyframes pulsoPensar {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }
            50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); }
        }

        @keyframes vibrar {
            0% { transform: translate(0.5px, 0.5px); }
            100% { transform: translate(-0.5px, -0.5px); }
        }
    </style>
</head>
<body>

    <h1>ARCH: DINNER OF THE CORES</h1>
    <p style="color: #64748b; font-size: 0.85rem; margin: 0 0 15px 0;">Ejemplo 3: Dos núcleos de CPU compitiendo por los Canales A y B de la memoria RAM.</p>

    <div class="dashboard">
        
        <!-- PANEL IZQUIERDO -->
        <div class="panel-control">
            <h3 style="margin:0; font-family:'Orbitron'; font-size:1rem; color:var(--cyan-glow);">Protocolos</h3>
            
            <button class="btn-danger" onclick="iniciarModoConflicto()">⚡ SIMULAR INTERBLOQUEO</button>
            <button class="btn-success" onclick="iniciarModoMutex()">🛡️ ACTIVAR ALGORITMO (MUTEX)</button>
            <button onclick="reiniciarSistema()">🔄 REINICIAR BUSES</button>
            
            <h3 style="margin:10px 0 0 0; font-family:'Orbitron'; font-size:1rem; color:var(--purple-glow);">Monitor de Bus</h3>
            <div class="terminal" id="term">> Microarquitectura inicializada.<br>> Estado: IDLE. Esperando simulación...</div>
        </div>

        <!-- ESCENARIO VISUAL MEJORADO -->
        <div class="escenario-visual">
            
            <!-- Capa de líneas físicas SVG -->
            <svg class="bus-svg">
                <!-- Líneas fijas del circuito (Buses) -->
                <!-- Núcleo 1 a RAM A y B -->
                <path id="line1A" class="bus-line" d="M 215 260 L 350 65" />
                <path id="line1B" class="bus-line" d="M 215 260 L 350 465" />
                <!-- Núcleo 2 a RAM A y B -->
                <path id="line2A" class="bus-line" d="M 665 260 L 530 65" />
                <path id="line2B" class="bus-line" d="M 665 260 L 530 465" />

                <!-- Pulsos de datos dinámicos -->
                <path id="pulse1A" class="data-pulse" d="M 215 260 L 350 65" />
                <path id="pulse1B" class="data-pulse" d="M 215 260 L 350 465" />
                <path id="pulse2A" class="data-pulse" d="M 665 260 L 530 65" />
                <path id="pulse2B" class="data-pulse" d="M 665 260 L 530 465" />
            </svg>
            
            <!-- Canales RAM Compartidos (Tenedores) -->
            <div id="ramA" class="ram-channel">CANAL RAM A</div>
            <div id="ramB" class="ram-channel">CANAL RAM B</div>

            <!-- Núcleo 1 (Filósofo Par) -->
            <div id="c1" class="hardware-core pensando">
                <span style="font-size:1.8rem;">🎮</span>
                <b style="font-size:0.75rem; margin-top:5px; color:var(--cyan-glow);">NÚCLEO 1</b>
                <span id="state-c1" class="estado-texto">PENSANDO</span>
            </div>

            <!-- Núcleo 2 (Filósofo Impar) -->
            <div id="c2" class="hardware-core pensando">
                <span style="font-size:1.8rem;">🧠</span>
                <b style="font-size:0.75rem; margin-top:5px; color:var(--cyan-glow);">NÚCLEO 2</b>
                <span id="state-c2" class="estado-texto">PENSANDO</span>
            </div>

        </div>
    </div>

    <script>
        let timeouts = [];

        function log(msg, color = "#8892b0") {
            const t = document.getElementById('term');
            t.innerHTML += `<br><span style="color:${color}">> ${msg}</span>`;
            t.scrollTop = t.scrollHeight;
        }

        function limpiarTimeouts() {
            timeouts.forEach(clearTimeout);
            timeouts = [];
        }
function activarPulso(idPulso, color, reversible = false) {
    const p = document.getElementById(idPulso);
    p.style.display = "block";
    p.style.stroke = color;
    p.style.animation = reversible ? "flowData 1.5s linear infinite reverse" : "flowData 1.5s linear infinite";
}

function desactivarPulso(idPulso) {
    document.getElementById(idPulso).style.display = "none";
}

function reiniciarSistema() {
    limpiarTimeouts();
    
    // Reset Cores
    document.getElementById('c1').className = "hardware-core pensando";
    document.getElementById('c2').className = "hardware-core pensando";
    document.getElementById('state-c1').innerText = "PENSANDO";
    document.getElementById('state-c2').innerText = "PENSANDO";
    document.getElementById('state-c1').style.color = "#8892b0";
    document.getElementById('state-c2').style.color = "#8892b0";
    
    // Reset RAMs
    document.getElementById('ramA').className = "ram-channel";
    document.getElementById('ramB').className = "ram-channel";
    document.getElementById('ramA').innerText = "CANAL RAM A";
    document.getElementById('ramB').innerText = "CANAL RAM B";
    
    // Reset Buses SVG
    document.querySelectorAll('.bus-line').forEach(l => l.style.stroke = "var(--bus-color)");
    document.querySelectorAll('.data-pulse').forEach(p => p.style.display = "none");
    document.getElementById('term').innerHTML = "> Buses físicos liberados.<br>> Estado: IDLE.";
}

// ================= MODO 1: INTERBLOQUEO (ERROR) =================
function iniciarModoConflicto() {
    reiniciarSistema();
    log("Iniciando procesos paralelos sin algoritmo de control...", "var(--warning-amber)");
    
    // Ambos entran en hambre
    timeouts.push(setTimeout(() => {
        document.getElementById('c1').className = "hardware-core hambre";
        document.getElementById('c2').className = "hardware-core hambre";
        document.getElementById('state-c1').innerText = "SOLICITANDO RAM";
        document.getElementById('state-c2').innerText = "SOLICITANDO RAM";
        log("Núcleo 1 requiere Canal A y B para renderizar Video.");
        log("Núcleo 2 requiere Canal B y A para procesar Red Neuronal.");
    }, 1000));
    
    // Conflicto de asignación simultánea
    timeouts.push(setTimeout(() => {
        // Núcleo 1 toma A
        document.getElementById('ramA').className = "ram-channel ram-ocupada";
        document.getElementById('ramA').innerText = "OCUPADO POR CORE 1";
        document.getElementById('line1A').style.stroke = "var(--error-red)";
        activarPulso("pulse1A", "var(--error-red)");
        log("[LATCH] Núcleo 1 bloqueó con éxito el Canal A.", "var(--cyan-glow)");
        
        // Núcleo 2 toma B
        document.getElementById('ramB').className = "ram-channel ram-ocupada";
        document.getElementById('ramB').innerText = "OCUPADO POR CORE 2";
        document.getElementById('line2B').style.stroke = "var(--error-red)";
        activarPulso("pulse2B", "var(--error-red)");
        log("[LATCH] Núcleo 2 bloqueó con éxito el Canal B.", "var(--cyan-glow)");
    }, 2500));
    
    // Intento cruzado fallido (Espera circular / Deadlock)
    timeouts.push(setTimeout(() => {
        document.getElementById('c1').className = "hardware-core bloqueado";
        document.getElementById('c2').className = "hardware-core bloqueado";
        document.getElementById('state-c1').innerText = "TRABADO (ESPERA B)";
        document.getElementById('state-c2').innerText = "TRABADO (ESPERA A)";
        document.getElementById('state-c1').style.color = "var(--error-red)";
        document.getElementById('state-c2').style.color = "var(--error-red)";
        document.getElementById('line1B').style.stroke = "var(--warning-amber)";
        document.getElementById('line2A').style.stroke = "var(--warning-amber)";
        log("CRITICAL: Núcleo 1 espera perpetuamente el Canal B.", "var(--error-red)");
        log("CRITICAL: Núcleo 2 espera perpetuamente el Canal A.", "var(--error-red)");
        log("💥 ARQUITECTURA EN DEADLOCK. El bus físico se ha congelado (Bus Lockup).", "var(--error-red)");
    }, 4000));
}

// ================= MODO 2: MUTEX ASIMÉTRICO (EXITOSO) =================
function iniciarModoMutex() {
    reiniciarSistema();
    log("Protocolo Mutex Asimétrico Activado (Core 1: Par, Core 2: Impar).", "var(--success-green)");
    
    // Ambos tienen hambre
    timeouts.push(setTimeout(() => {
        document.getElementById('c1').className = "hardware-core hambre";
        document.getElementById('c2').className = "hardware-core hambre";
        document.getElementById('state-c1').innerText = "SOLICITANDO RAM";
        document.getElementById('state-c2').innerText = "SOLICITANDO RAM";
        log("Ambos núcleos despiertan. Regla: Ambos deben intentar bloquear primero el Canal A.");
    }, 1000));
    
    // Núcleo 1 gana la prioridad sobre el Canal A
    timeouts.push(setTimeout(() => {
        document.getElementById('ramA').className = "ram-channel ram-ocupada";
        document.getElementById('ramA').innerText = "OCUPADO POR CORE 1";
        document.getElementById('line1A').style.stroke = "var(--success-green)";
        activarPulso("pulse1A", "var(--success-green)");
        log("[MUTEX] Núcleo 1 bloquea Canal A. Núcleo 2 detecta bloqueo y entra en espera (Sleep Mode).", "var(--success-green)");
        document.getElementById('c2').className = "hardware-core pensando";
        document.getElementById('state-c2').innerText = "ESPERANDO (SLEEP)";
    }, 2500));
    
    // Núcleo 1 toma el Canal B libremente y ejecuta
    timeouts.push(setTimeout(() => {
        document.getElementById('ramB').className = "ram-channel ram-ocupada";
        document.getElementById('ramB').innerText = "OCUPADO POR CORE 1";
        document.getElementById('line1B').style.stroke = "var(--success-green)";
        activarPulso("pulse1B", "var(--success-green)");
        document.getElementById('c1').className = "hardware-core comiendo";
        document.getElementById('state-c1').innerText = "PROCESANDO DATOS";
        document.getElementById('state-c1').style.color = "var(--success-green)";
        log("[EXEC] Núcleo 1 tiene ambos canales. Procesando video a 60 FPS...", "var(--cyan-glow)");
    }, 4000));
    
    // Núcleo 1 termina y libera todo. Núcleo 2 despierta
    timeouts.push(setTimeout(() => {
        desactivarPulso("pulse1A");
        desactivarPulso("pulse1B");
        document.getElementById('line1A').style.stroke = "var(--bus-color)";
        document.getElementById('line1B').style.stroke = "var(--bus-color)";
        document.getElementById('c1').className = "hardware-core pensando";
        document.getElementById('state-c1').innerText = "PENSANDO (IDLE)";
        document.getElementById('state-c1').style.color = "#8892b0";
        log("[RELEASE] Núcleo 1 finalizó. Liberando Canales A y B.");
        
        // Núcleo 2 toma el control de los dos canales de golpe
        document.getElementById('ramA').className = "ram-channel ram-ocupada";
        document.getElementById('ramB').className = "ram-channel ram-ocupada";
        document.getElementById('ramA').innerText = "OCUPADO POR CORE 2";
        document.getElementById('ramB').innerText = "OCUPADO POR CORE 2";
        document.getElementById('line2A').style.stroke = "var(--success-green)";
        document.getElementById('line2B').style.stroke = "var(--success-green)";
        activarPulso("pulse2A", "var(--success-green)");
        activarPulso("pulse2B", "var(--success-green)");
        document.getElementById('c2').className = "hardware-core comiendo";
        document.getElementById('state-c2').innerText = "PROCESANDO DATOS";
        document.getElementById('state-c2').style.color = "var(--success-green)";
        log("[EXEC] Núcleo 2 despierta, toma el control y ejecuta la Red Neuronal.", "var(--cyan-glow)");
    }, 6500));
    
    // Fin del ciclo perfecto
    timeouts.push(setTimeout(() => {
        reiniciarSistema();
        log("✨ Ciclo completado con éxito. El procesador operó a máxima eficiencia sin interbloqueos.", "var(--success-green)");
    }, 9500));
}
