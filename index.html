<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Architecture: The Philosophers' Dinner</title>
    <!-- Importamos una fuente futurista -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0b10;
            --panel-bg: #121420;
            --cyan-glow: #00f0ff;
            --purple-glow: #bd00ff;
            --error-red: #ff0055;
            --warning-amber: #ffaa00;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            color: var(--cyan-glow);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            margin-top: 20px;
        }

        .panel-control {
            background: var(--panel-bg);
            border: 1px solid #22263f;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .escenario-visual {
            background: var(--panel-bg);
            border: 1px solid #22263f;
            border-radius: 12px;
            position: relative;
            height: 500px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            overflow: hidden;
        }

        /* Representación estilizada de los Núcleos */
        .hardware-core {
            width: 140px;
            height: 140px;
            background: #1a1d36;
            border: 2px solid var(--cyan-glow);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            transition: all 0.4s ease;
            z-index: 2;
        }

        .hardware-core.pensando {
            animation: pulsoPensar 2s infinite ease-in-out;
        }

        .hardware-core.bloqueado {
            border-color: var(--error-red);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            animation: vibrar 0.15s infinite;
        }

        /* Representación de la RAM */
        .ram-channel {
            width: 200px;
            height: 45px;
            background: #25123e;
            border: 2px solid var(--purple-glow);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.2);
            position: absolute;
        }

        #ramA { top: 80px; }
        #ramB { bottom: 80px; }

        /* Botones ciberpunk */
        button {
            width: 100%;
            background: transparent;
            color: var(--cyan-glow);
            border: 1px solid var(--cyan-glow);
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* Consola de diagnóstico */
        .terminal {
            background: #05060a;
            border-left: 3px solid var(--warning-amber);
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #8892b0;
            height: 150px;
            overflow-y: auto;
            border-radius: 4px;
        }

        /* Animaciones CSS avanzadas */
        @keyframes pulsoPensar {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
            50% { box-shadow: 0 0 30px rgba(0, 240, 255, 0.6); }
            100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
        }

        @keyframes vibrar {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -2px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <h1>ARCH: DINNER OF THE CORES</h1>
    <p style="color: #64748b;">Demostración interactiva del problema de concurrencia de Dijkstra en Hardware real.</p>

    <div class="dashboard">
        
        <!-- PANEL IZQUIERDO: CONTROLES -->
        <div class="panel-control">
            <h3>Sincronización</h3>
            <button onclick="desatarDeadlock()">MODO CONFLICTO</button>
            <button onclick="alert('Próximamente: Implementación de Semáforos')" style="border-color: var(--purple-glow); color: var(--purple-glow);">MODO MUTEX (OK)</button>
            
            <h3 style="margin-top:30px;">Consola de Bus</h3>
            <div class="terminal" id="term">[SYSTEM] Microarquitectura en línea. Esperando instrucciones...</div>
        </div>

        <!-- PANEL DERECHO: EL CIRCUITO ANIMADO -->
        <div class="escenario-visual">
            
            <!-- Canales RAM Compartidos -->
            <div id="ramA" class="ram-channel">BUS: CANAL RAM A</div>
            <div id="ramB" class="ram-channel">BUS: CANAL RAM B</div>

            <!-- Núcleos / Filósofos -->
            <div id="c1" class="hardware-core pensando">
                <span style="font-size:1.5rem;">🎮</span>
                <b style="font-size:0.8rem; margin-top:5px;">NÚCLEO 1</b>
            </div>

            <div id="c2" class="hardware-core pensando">
                <span style="font-size:1.5rem;">🧠</span>
                <b style="font-size:0.8rem; margin-top:5px;">NÚCLEO 2</b>
            </div>

        </div>
    </div>

    <script>
        function log(msg) {
            const t = document.getElementById('term');
            t.innerHTML += `<br><span style="color:#fff">></span> ${msg}`;
            t.scrollTop = t.scrollHeight;
        }

        function desatarDeadlock() {
            log("<span style='color:var(--warning-amber)'>[WARN] Desactivando protocolos de exclusión mutua...</span>");
            
            setTimeout(() => {
                document.getElementById('c1').className = "hardware-core bloqueado";
                log("[CORE 01] Reclamó Canal RAM A. Esperando Canal B...");
            }, 800);

            setTimeout(() => {
                document.getElementById('c2').className = "hardware-core bloqueado";
                log("[CORE 02] Reclamó Canal RAM B. Esperando Canal A...");
            }, 1400);

            setTimeout(() => {
                log("<span style='color:var(--error-red)'>[CRITICAL] DEADLOCK DETECTADO: Interbloqueo cíclico en los buses físicos de memoria. El sistema operativo requiere un reinicio duro.</span>");
            }, 2500);
        }
    </script>
</body>
</html>
